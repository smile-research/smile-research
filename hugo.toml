baseURL = 'https://smile-research.com/'
languageCode = 'en-us'
theme = 'dk-hugo-theme'
title = "SMILE"

# Configure output formats
[outputs]
home = ["HTML", "RSS", "searchindex"]

[outputFormats.searchindex]
baseName = "searchindex"
mediaType = "application/json"
isPlainText = true

# Disable built-in syntax highlighting (using highlight.js instead)
[markup]
[markup.highlight]
codeFences = false
noClasses = false

# Enable LaTeX support
[markup.goldmark.renderer]
unsafe = true

# Configure table of contents
[markup.tableOfContents]
endLevel = 3
ordered = false
startLevel = 2

# Configure menu
[menu]
[[menu.main]]
identifier = "home"
name = "Home"
url = "/"
weight = 1

[[menu.main]]
identifier = "news"
name = "News"
url = "/news/"
weight = 2

[[menu.main]]
identifier = "papers"
name = "Papers"
url = "/papers/"
weight = 3

[[menu.main]]
identifier = "about"
name = "About"
url = "/about/"
weight = 4

# Configure taxonomies
[taxonomies]
category = "categories"
tag = "tags"

# Parameters for theme
[params]
author = "SMILE Research Group"
description = "SMILE research group from Silesian University of Technology"
email = "contact@smile-research.com"
github = "https://github.com/smile-research"
